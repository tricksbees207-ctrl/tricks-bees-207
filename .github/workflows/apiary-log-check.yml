name: Apiary Log code checks

on:
  pull_request:
    paths:
      - 'apiary-log.html'
      - 'winter-readiness.html'
      - 'js/apiary-complete-backup-v3.js'
      - 'js/apiary-backup-verifier-v3.js'
      - 'tests/winter-live-integration.test.mjs'
      - 'tests/winter-actual-dom.test.mjs'
      - 'tests/winter-browser-smoke.mjs'
      - 'tests/winter-embedded-auth.test.mjs'
      - 'tests/winter-migration-fixture.sql'
      - 'tests/winter-migration-smoke.sql'
      - 'database/migrations/20261021_winter_readiness_production_schema.sql'
      - 'recovery-test.html'
      - 'js/recurring-expenses.js'
      - 'database/migrations/20261018_automatic_recurring_core.sql'
      - 'database/migrations/20261018_automatic_recurring_schedule.sql'
      - 'js/apiary-backup-verifier.js'
      - 'js/apiary-complete-backup.js'
      - 'tests/recurring-ui.test.mjs'
      - 'tests/recurring-backup.test.mjs'
      - 'tests/recurring-browser-smoke.mjs'
      - '.github/workflows/apiary-log-check.yml'
  push:
    paths:
      - 'apiary-log.html'
      - 'winter-readiness.html'
      - 'js/apiary-complete-backup-v3.js'
      - 'js/apiary-backup-verifier-v3.js'
      - 'tests/winter-live-integration.test.mjs'
      - 'tests/winter-actual-dom.test.mjs'
      - 'tests/winter-browser-smoke.mjs'
      - 'tests/winter-embedded-auth.test.mjs'
      - 'tests/winter-migration-fixture.sql'
      - 'tests/winter-migration-smoke.sql'
      - 'database/migrations/20261021_winter_readiness_production_schema.sql'
      - 'recovery-test.html'
      - 'js/recurring-expenses.js'
      - 'database/migrations/20261018_automatic_recurring_core.sql'
      - 'database/migrations/20261018_automatic_recurring_schedule.sql'
      - 'js/apiary-backup-verifier.js'
      - 'js/apiary-complete-backup.js'
      - 'tests/recurring-ui.test.mjs'
      - 'tests/recurring-backup.test.mjs'
      - 'tests/recurring-browser-smoke.mjs'
      - '.github/workflows/apiary-log-check.yml'

permissions:
  contents: read

jobs:
  check-apiary-log:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check inline JavaScript syntax and MFA element references
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const os = require('node:os');
          const path = require('node:path');
          const cp = require('node:child_process');
          const assert = require('node:assert/strict');
          const html = fs.readFileSync('apiary-log.html', 'utf8');
          const scripts = [...html.matchAll(/<script\b([^>]*)>([\s\S]*?)<\/script>/gi)];
          let checked = 0;
          for (const [index, match] of scripts.entries()) {
            const attributes = match[1];
            const code = match[2].trim();
            if (!code || /\bsrc\s*=/.test(attributes)) continue;
            const file = path.join(os.tmpdir(), 'apiary-script-' + index + ( /type\s*=\s*["']module["']/.test(attributes) ? '.mjs' : '.js'));
            fs.writeFileSync(file, code);
            cp.execFileSync(process.execPath, ['--check', file], {stdio: 'inherit'});
            checked++;
          }
          assert.ok(checked > 0, 'No inline scripts found');
          const ids = [
            'login', 'dashboard', 'mfaChallenge', 'mfaChallengeForm',
            'mfaChallengeCode', 'mfaChallengeMessage', 'mfaChallengeSignOut',
            'mfaSettingsStatus', 'mfaStartEnroll', 'mfaEnrollment',
            'mfaEnrollQR', 'mfaEnrollSecret', 'mfaEnrollForm',
            'mfaEnrollCode', 'mfaCancelEnroll', 'mfaEnrollMessage'
          ];
          for (const id of ids) {
            assert.ok(html.includes('id="' + id + '"'), 'Missing MFA element: ' + id);
          }
          console.log('Syntax passed for ' + checked + ' scripts; all ' + ids.length + ' MFA elements found.');
          NODE
      - name: Check recurring-payment, backup, and recovery modules
        run: |
          for file in js/recurring-expenses.js js/apiary-backup-verifier.js js/apiary-complete-backup.js; do
            node --input-type=module --check < "$file"
          done
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const html = fs.readFileSync('apiary-log.html', 'utf8');
          const recovery = fs.readFileSync('recovery-test.html', 'utf8');
          const sql = fs.readFileSync('database/migrations/20261017_recurring_expenses.sql', 'utf8');
          const auto = fs.readFileSync('database/migrations/20261018_automatic_recurring_core.sql', 'utf8');
          const cron = fs.readFileSync('database/migrations/20261018_automatic_recurring_schedule.sql', 'utf8');
          const backup = fs.readFileSync('js/apiary-complete-backup.js', 'utf8');
          const verifier = fs.readFileSync('js/apiary-backup-verifier.js', 'utf8');
          assert.match(html, /setupRecurringExpenses/);
          assert.match(html, /id="expenseRepeat"/);
          assert.match(html, /id="expenseRepeatFrequency"/);
          assert.match(html, /recurringManager\.enableFromExpense/);
          assert.match(auto, /enable_auto_recurring_expense/);
          assert.match(auto, /post_due_auto_recurring_expenses/);
          assert.match(auto, /ON CONFLICT \(recurring_template_id, recurring_due_date\) DO NOTHING/);
          assert.match(auto, /REVOKE ALL ON FUNCTION public\.post_due_auto_recurring_expenses/);
          assert.match(cron, /cron\.schedule/);
          assert.match(cron, /post_due_auto_recurring_expenses/);
          assert.match(html, /recurringManager\.refresh/);
          assert.match(recovery, /getTables/);
          assert.match(recovery, /xvthtxcinwbopoixaggv/);
          assert.doesNotMatch(recovery, /mkypanucvttinkjggxzv/, 'Recovery lab must not reference production');
          assert.match(sql, /record_recurring_expense/);
          assert.match(sql, /UNIQUE \(recurring_template_id, recurring_due_date\)/);
          assert.match(backup, /'Apiary_Recurring_Expenses'/);
          assert.match(verifier, /manifest\.version===1\|\|manifest\.version===2/);
          console.log('Recurring and recovery static safety checks passed.');
          NODE
      - name: Check staged Winter Readiness integration
        run: |
          node --input-type=module --check < js/apiary-complete-backup-v3.js
          node --input-type=module --check < js/apiary-backup-verifier-v3.js
          node tests/winter-live-integration.test.mjs
      - name: Install DOM test dependency
        run: npm install --no-save --no-package-lock --ignore-scripts jsdom@26 playwright@1.56.1
      - name: Render Winter hive navigation in disposable DOM
        run: node tests/winter-actual-dom.test.mjs
      - name: Test Winter navigation in headless Chrome without network
        run: node tests/winter-browser-smoke.mjs
      - name: Test embedded Winter shared-session sign-out in Chrome
        run: node tests/winter-embedded-auth.test.mjs
      - name: Test automatic recurring entries and backup compatibility
        run: node --test tests/recurring-ui.test.mjs tests/recurring-backup.test.mjs
      - name: Test recurring UI in headless Chrome browser
        run: node tests/recurring-browser-smoke.mjs

  winter-database-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install fake auth and hive dependencies in disposable DB
        run: psql -X -v ON_ERROR_STOP=1 -f tests/winter-migration-fixture.sql
      - name: Execute Winter schema migration in disposable DB
        run: psql -X -v ON_ERROR_STOP=1 -f database/migrations/20261021_winter_readiness_production_schema.sql
      - name: Test live Winter SQL routines and access controls
        run: psql -X -v ON_ERROR_STOP=1 -f tests/winter-migration-smoke.sql
