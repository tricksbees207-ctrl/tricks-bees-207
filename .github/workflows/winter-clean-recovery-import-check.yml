name: Disposable Winter 25-table restore rehearsal

on:
  pull_request:
    paths:
      - 'database/migrations/20261021_winter_readiness_production_schema.sql'
      - 'database/migrations/20261021_winter_v3_recovery_test_import.sql'
      - 'tests/prepare-winter-clean-recovery-fixture.mjs'
      - 'tests/winter-clean-recovery-import-smoke.sql'
      - 'tests/winter-migration-fixture.sql'
      - '.github/workflows/winter-clean-recovery-import-check.yml'

permissions:
  contents: read

jobs:
  recovery-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Generate fully EMPTY 19-table test destination
        run: |
          node tests/prepare-winter-clean-recovery-fixture.mjs "$RUNNER_TEMP/empty-recovery.sql"
          psql -X -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/empty-recovery.sql"
      - name: Install Winter migration and TEST ONLY recovery importer
        run: |
          psql -X -v ON_ERROR_STOP=1 -f database/migrations/20261021_winter_readiness_production_schema.sql
          psql -X -v ON_ERROR_STOP=1 -f database/migrations/20261021_winter_v3_recovery_test_import.sql
      - name: Preview, commit and verify synthetic 25-table winter restore
        run: psql -X -v ON_ERROR_STOP=1 -f tests/winter-clean-recovery-import-smoke.sql
