name: Isolated Winter database migration check

on:
  pull_request:
    paths:
      - 'database/migrations/20261021_winter_readiness_production_schema.sql'
      - 'tests/winter-migration-fixture.sql'
      - 'tests/winter-migration-smoke.sql'
      - '.github/workflows/winter-staging-db-check.yml'

permissions:
  contents: read

jobs:
  verify-winter-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Confirm isolated PostgreSQL
        run: |
          psql -v ON_ERROR_STOP=1 -c 'SELECT version();'
      - name: Install disposable Supabase-equivalent auth and hive fixture
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/winter-migration-fixture.sql
      - name: Execute proposed migration in disposable database
        run: |
          psql -X -v ON_ERROR_STOP=1 -f database/migrations/20261021_winter_readiness_production_schema.sql
      - name: Exercise Winter lifecycle and security
        run: |
          psql -X -v ON_ERROR_STOP=1 -f tests/winter-migration-smoke.sql
