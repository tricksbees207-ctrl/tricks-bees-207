name: Disposable Supabase Winter installation rehearsal

on:
  pull_request:
    paths:
      - 'database/migrations/20261021_winter_readiness_production_schema.sql'
      - 'tests/winter-migration-fixture.sql'
      - 'tests/winter-migration-smoke.sql'
      - 'tests/prepare-winter-supabase-fixture.mjs'
      - '.github/workflows/winter-local-supabase-rehearsal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  supabase-db-installation:
    # A fresh, local Supabase database. Do NOT link to or access hosted projects.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PGHOST: 127.0.0.1
      PGPORT: 54322
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: 2.84.2
      - name: Confirm Supabase CLI and supported database options
        run: |
          supabase --version
          supabase db start --help
      - name: Start a fresh local Supabase database in temporary runner directory
        run: |
          mkdir -p "$RUNNER_TEMP/winter-supabase-rehearsal"
          cd "$RUNNER_TEMP/winter-supabase-rehearsal"
          supabase init
          supabase db start
      - name: Verify native Supabase Auth and database roles
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          BEGIN
            IF to_regclass('auth.users') IS NULL
                OR to_regprocedure('auth.uid()') IS NULL
                OR to_regprocedure('auth.jwt()') IS NULL
                OR NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='authenticated')
                OR NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='service_role')
            THEN
              RAISE EXCEPTION 'Supabase Auth schema or roles not ready';
            END IF;
          END
          $check$;
          SQL
      - name: Install production-derived application schema with synthetic records
        run: |
          node tests/prepare-winter-supabase-fixture.mjs "$RUNNER_TEMP/winter-supabase-fixture.sql"
          psql -X -v ON_ERROR_STOP=1 -f "$RUNNER_TEMP/winter-supabase-fixture.sql"
      - name: Install proposed Winter migration in local Supabase
        run: psql -X -v ON_ERROR_STOP=1 -f database/migrations/20261021_winter_readiness_production_schema.sql
      - name: Test winter lifecycle, audit immutability, RLS, MFA and history isolation
        run: psql -X -v ON_ERROR_STOP=1 -f tests/winter-migration-smoke.sql
      - name: Check Winter tables in native Supabase catalogs
        run: |
          psql -X -v ON_ERROR_STOP=1 <<'SQL'
          DO $check$
          DECLARE n integer;
          BEGIN
            SELECT count(*) INTO n FROM pg_tables
             WHERE schemaname='public' AND tablename LIKE 'Winter_%' AND rowsecurity;
            IF n<>7 THEN
              RAISE EXCEPTION 'Expected seven Supabase RLS-enabled Winter tables, got %',n;
            END IF;
            RAISE NOTICE 'LOCAL SUPABASE: 7 Winter tables installed, RLS enabled';
          END
          $check$;
          SQL
      - name: Dispose local Supabase database
        if: always()
        run: |
          if [ -d "$RUNNER_TEMP/winter-supabase-rehearsal/supabase" ]; then
            cd "$RUNNER_TEMP/winter-supabase-rehearsal"
            supabase stop || true
          fi
