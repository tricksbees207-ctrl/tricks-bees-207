
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tricks Bees 207 | Apiary Log</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fff9e8;
      color: #30291d;
      margin: 0;
    }
    header {
      background: #29241b;
      color: #ffcc45;
      padding: 22px;
      text-align: center;
    }
    main {
      max-width: 750px;
      margin: 35px auto;
      padding: 24px;
    }
    .panel {
      background: white;
      border: 1px solid #e8dcbf;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 20px;
    }
    input, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
    }
    button {
      background: #e6ad25;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }
    .hidden { display: none; }
    .error { color: #a32626; }
    .muted { color: #686052; }
 #inspectionPanel label {
  display: block;
  margin-top: 16px;
  margin-bottom: 6px;
  font-weight: bold;
}

#inspectionPanel input,
#inspectionPanel select,
#inspectionPanel textarea {
  display: block;
  width: 100%;
  box-sizing: border-box;
  padding: 12px;
  margin-bottom: 12px;
  font-size: 16px;
  border: 1px solid #aaa;
  border-radius: 6px;
}

#inspectionPanel textarea {
  min-height: 120px;
}
  </style>
</head>
<body>
  <header>
    <h1>🐝 Tricks Bees 207</h1>
    <p>Private Apiary Log</p>
  </header>

  <main>
    <section id="login" class="panel">
      <h2>Owner Sign In</h2>
      <p>Sign in with your Apiary Log account.</p>
      <form id="loginForm">
        <input id="email" type="email"
          placeholder="Email address" required>
        <input id="password" type="password"
          placeholder="Password" required>
        <button type="submit">Sign In</button>
      </form>
      <p id="loginMessage" class="error"
        role="status"></p>
    </section>

    <section id="dashboard" class="hidden">
      <div class="panel">
        <h2>Apiary Dashboard</h2>
        <p class="muted">Your registered hives</p>
        <div id="hiveList">Loading hives...</div>
        
<div id="inspectionPanel" style="display:none; margin-top:25px;">
  <h2 id="inspectionTitle">Hive Inspection</h2>
  <p>Record an inspection for the selected hive.</p>
  
<label for="inspectionDate">Inspection Date</label>
<input type="date" id="inspectionDate" required>
  
<label for="queenSeen">Queen Seen?</label>
<select id="queenSeen">
  <option value="">Not recorded</option>
  <option value="true">Yes</option>
  <option value="false">No</option>
</select>

<label for="eggsSeen">Eggs Seen?</label>
<select id="eggsSeen">
  <option value="">Not recorded</option>
  <option value="true">Yes</option>
  <option value="false">No</option>
</select>

<label for="broodPattern">Brood Pattern</label>
<select id="broodPattern">
  <option value="">Not recorded</option>
  <option value="Solid">Solid / Excellent</option>
  <option value="Good">Good</option>
  <option value="Spotty">Spotty / Poor</option>
  <option value="No brood">No brood present</option>
</select>


<label for="temperament">Hive Temperament</label>
<select id="temperament">
  <option value="">Not recorded</option>
  <option value="Calm">Calm / Gentle</option>
  <option value="Normal">Normal</option>
  <option value="Defensive">Defensive</option>
  <option value="Aggressive">Aggressive</option>
</select>

<label for="honeyStores">Honey Stores</label>
<select id="honeyStores">
  <option value="">Not recorded</option>
  <option value="Abundant">Abundant</option>
  <option value="Adequate">Adequate</option>
  <option value="Low">Low</option>
  <option value="None">None</option>
</select>

<label for="pollenStores">Pollen Stores</label>
<select id="pollenStores">
  <option value="">Not recorded</option>
  <option value="Abundant">Abundant</option>
  <option value="Adequate">Adequate</option>
  <option value="Low">Low</option>
  <option value="None">None</option>
</select>

<label for="colonyStrength">Colony Strength</label>
<select id="colonyStrength">
  <option value="">Not recorded</option>
  <option value="Very Strong">Very Strong</option>
  <option value="Strong">Strong</option>
  <option value="Moderate">Moderate</option>
  <option value="Weak">Weak</option>
  <option value="Very Weak">Very Weak</option>
</select>

<label for="inspectionNotes">Inspection Notes</label>
<textarea id="inspectionNotes" rows="5"
  placeholder="Record observations, concerns, and work needed..."></textarea>

<button type="button" id="saveInspection">
  Save Inspection
</button>

<p id="inspectionMessage"></p>

</div>

        <button id="logout">Sign Out</button>
      </div>
    </section>
  </main>

  <script type="module">
    import { createClient } from
      "https://esm.sh/@supabase/supabase-js@2";

    const supabase = createClient(
      "https://mkypanucvttinkjggxzv.supabase.co",
      "sb_publishable_-mN1hBm5z7YCjBzg_LDU4g_5C3N8ejJ"
    );

    const login = document.getElementById("login");
    const dashboard =
      document.getElementById("dashboard");
    const message =
      document.getElementById("loginMessage");

    async function showDashboard(session) {
      if (!session) {
        login.classList.remove("hidden");
        dashboard.classList.add("hidden");
        return;
      }

      login.classList.add("hidden");
      dashboard.classList.remove("hidden");

      const list = document.getElementById("hiveList");
      list.textContent = "Loading hives...";

      const { data, error } = await supabase
        .from("Hives")
        .select("id,hive_number,hive_name,hive_location")
        .order("hive_number");

      if (error) {
        list.textContent = error.message;
        return;
      }

      list.replaceChildren();

      
for (const hive of data || []) {
    const item = document.createElement("button");

    item.type = "button";
    item.textContent =
        `Hive ${hive.hive_number}: ` +
        `${hive.hive_name || "Unnamed"} ` +
        `(${hive.hive_location || "No location"})`;

    item.style.display = "block";
    item.style.width = "100%";
    item.style.padding = "12px";
    item.style.marginBottom = "10px";
    item.style.textAlign = "left";
    item.style.cursor = "pointer";

    item.addEventListener("click", () => {
  document.getElementById("inspectionTitle").textContent =
    `Hive ${hive.hive_number}: ${hive.hive_name || "Unnamed"} Inspection`;

  document.getElementById("inspectionPanel").style.display = "block";
});

    list.appendChild(item);
}

    }

document.getElementById("saveInspection")
  .addEventListener("click", async () => {
    const message = document.getElementById("inspectionMessage");
    message.textContent = "Preparing to save inspection...";
  });


    
    document.getElementById("loginForm")
      .addEventListener("submit", async (event) => {
        event.preventDefault();
        message.textContent = "";

        const { error } =
          await supabase.auth.signInWithPassword({
            email: document.getElementById("email").value,
            password:
              document.getElementById("password").value
          });

        if (error) message.textContent = error.message;
      });

    document.getElementById("logout")
      .addEventListener("click", async () => {
        await supabase.auth.signOut();
      });

    supabase.auth.onAuthStateChange(
      (_event, session) => {
        setTimeout(() => showDashboard(session), 0);
      }
    );
  </script>
</body>
</html>
